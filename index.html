.pa-info h3{font-size:14px;font-weight:700}
.pa-info .pa-role{font-size:11px;color:#64748b}
.pa-info .pa-summary{font-size:12px;color:#475569;margin-top:3px;line-height:1.4}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}

.flag.yellow{background:#fefce8;color:#ca8a04}

.tab-bar{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #e2e8f0}
.tab-bar button{background:none;border:none;padding:10px 20px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}

.tab-bar button.active{color:#3b82f6;border-bottom-color:#3b82f6}
.tab-content{display:none}
.tab-content.active{display:block}

// Compute avgHrsPerWeek for Feb/Mar data
function computeAvgHrsPerWeek(data, numWeeks) {
  data.forEach(function(p) {
    var activeWeeks = 0;
    if (p.weekTotals) {
      Object.keys(p.weekTotals).forEach(function(k) { if (p.weekTotals[k] > 0) activeWeeks++; });
    }
    p.avgHrsPerWeek = activeWeeks > 0 ? Math.round(p.estHours / activeWeeks * 10) / 10 : 0;
  });
}
computeAvgHrsPerWeek(FEB_DATA, 4);
computeAvgHrsPerWeek(MAR_DATA, 5);

// Compute for April
APR_DATA.forEach(function(p) {
  var activeWeeks = 0;
  if (p.weekTotals) { Object.keys(p.weekTotals).forEach(function(k) { if (p.weekTotals[k] > 0) activeWeeks++; }); }
  p.avgHrsPerWeek = activeWeeks > 0 ? Math.round(p.estHours / activeWeeks * 10) / 10 : 0;
});

// Build Combined data
var COMBINED_DATA = [];
var nameList = FEB_DATA.map(function(p) { return p.name; });
nameList.forEach(function(name) {
  var feb = FEB_DATA.find(function(p) { return p.name === name; });
  var mar = MAR_DATA.find(function(p) { return p.name === name; });
  var apr = APR_DATA.find(function(p) { return p.name === name; });
  if (!feb || !mar || !apr) return;
  var total = feb.total + mar.total + apr.total;
  var reads = feb.reads + mar.reads + apr.reads;
  var creates = feb.creates + mar.creates + apr.creates;
  var updates = feb.updates + mar.updates + apr.updates;
  var productive = creates + updates;
  var ratio = reads > 0 ? Math.round(productive / reads * 100) / 100 : 0;
  var activeDays = feb.activeDays + mar.activeDays + apr.activeDays;
  var estHours = Math.round((feb.estHours + mar.estHours + apr.estHours) * 10) / 10;
  var dailyRate = activeDays > 0 ? Math.round(total / activeDays * 10) / 10 : 0;
  // Combined active weeks: count all weeks across 3 months with activity
  var allWeeks = 0;
  [feb, mar, apr].forEach(function(m) {
    if (m.weekTotals) { Object.keys(m.weekTotals).forEach(function(k) { if (m.weekTotals[k] > 0) allWeeks++; }); }
  });
  var avgHrsPerWeek = allWeeks > 0 ? Math.round(estHours / allWeeks * 10) / 10 : 0;
  COMBINED_DATA.push({
    name: name, role: feb.role, isBench: feb.isBench,
    total: total, reads: reads, creates: creates, updates: updates,
    productive: productive, ratio: ratio, activeDays: activeDays,
    estHours: estHours, dailyRate: dailyRate, avgHrsPerWeek: avgHrsPerWeek,
    weekTotals: {}
  });
});

// Chart instances tracker
var chartInstances = {};

function destroyCharts(prefix) {
  Object.keys(chartInstances).forEach(function(key) {
    if (key.startsWith(prefix)) {
      chartInstances[key].destroy();
      delete chartInstances[key];
    }
  });
}

function renderTab(tabId, data, monthLabel, workingDays, hasScores) {
  var container = document.getElementById('tab-' + tabId);
  var prefix = tabId + '_';

  // Build HTML
  var html = '';

  // Score cards row
  html += '<div class="scores-row" id="' + prefix + 'scoreCards"></div>';

  // Charts
  html += '<div class="chart-row"><div class="chart-box full"><h3>Monthly CRM Activity Volume - All Team (' + monthLabel + ')</h3><div class="chart-desc"><strong>Reads</strong> = opening/viewing a record (claim, contact, task). <strong>Creates</strong> = adding a new record (note, task, document, email, estimate). <strong>Updates</strong> = modifying an existing record (changing a claim stage, editing fields, updating status). Creates + Updates = productive actions.</div><canvas id="' + prefix + 'volumeChart" height="70"></canvas></div></div>';
  html += '<div class="chart-row"><div class="chart-box"><h3>Productive/Read Ratio</h3><div class="chart-desc">How many productive actions (creates + updates) per read. Above 1.0 = acting more than browsing. Below 0.5 = mostly just viewing records without taking action.</div><canvas id="' + prefix + 'ratioChart"></canvas></div>';
  html += '<div class="chart-box"><h3>Estimated Monthly Hours</h3><div class="chart-desc">Total hours estimated from CRM action volume using ~45 actions/hour calibration. Not a time clock &mdash; measures CRM engagement time only.</div><canvas id="' + prefix + 'hoursChart"></canvas></div></div>';
  html += '<div class="chart-row"><div class="chart-box"><h3>Active Days (of ~' + workingDays + ' working days)</h3><div class="chart-desc">Number of days with at least 1 CRM action logged. Missing days may indicate PTO, field work, or disengagement.</div><canvas id="' + prefix + 'daysChart"></canvas></div>';
  html += '<div class="chart-box"><h3>Daily Action Rate (avg/active day)</h3><div class="chart-desc">Average total actions per day they were active. Higher = more CRM throughput on working days.</div><canvas id="' + prefix + 'rateChart"></canvas></div></div>';
  html += '<div class="chart-row"><div class="chart-box full"><h3>Avg Hours per Week per Rep</h3><div class="chart-desc">Estimated monthly hours divided by the number of weeks with activity. Shows weekly CRM workload per rep &mdash; 40h/wk = full-time equivalent.</div><canvas id="' + prefix + 'weeklyHrsChart"></canvas></div></div>';

  // Individual assessments
  html += '<div class="section-title">Individual Assessments</div>';
  html += '<div class="chart-desc" style="margin-bottom:12px">Each card shows key metrics. <strong>Total Actions</strong> = all CRM events. <strong>Productive</strong> = creates + updates only. <strong>Prod/Read</strong> = ratio of productive to reads. <strong>Active Days</strong> = days with any CRM activity. <strong>Est. Hours</strong> = estimated CRM time. <strong>Actions/Day</strong> = avg actions on days worked. <strong>Avg Hrs/Wk</strong> = monthly hours / active weeks.</div>';
  html += '<div id="' + prefix + 'personCards"></div>';

  container.innerHTML = html;

  // Populate score cards
  var cardsEl = document.getElementById(prefix + 'scoreCards');
  var sortedByTotal = data.slice().sort(function(a, b) { return b.total - a.total; });
  sortedByTotal.forEach(function(p) {
    if (hasScores && p.score !== undefined) {
      cardsEl.innerHTML += '<div class="sc' + (p.isBench ? ' benchmark' : '') + '"><div class="name">' + p.name.split(' ')[0] + '</div><div class="role">' + p.role + '</div><div class="score s' + p.score + '">' + p.score + '<span class="slash">/10</span></div><div class="hrs">' + p.estHours + 'h &middot; ' + p.total.toLocaleString() + '</div></div>';
    } else {
      cardsEl.innerHTML += '<div class="sc' + (p.isBench ? ' benchmark' : '') + '"><div class="name">' + p.name.split(' ')[0] + '</div><div class="role">' + p.role + '</div><div class="hrs" style="margin-top:8px;font-size:11px;font-weight:600">' + p.estHours + 'h &middot; ' + p.total.toLocaleString() + '</div></div>';
    }
  });

  // Charts
  var sorted = data.slice().sort(function(a, b) { return b.total - a.total; });
  var names = sorted.map(function(p) { return p.name.split(' ').slice(0, 2).join(' '); });
  var barC = sorted.map(function(p) { return p.isBench ? '#3b82f6' : (hasScores && p.score !== undefined) ? (p.score >= 8 ? '#22c55e' : p.score >= 7 ? '#84cc16' : p.score >= 5 ? '#eab308' : p.score >= 4 ? '#f97316' : '#ef4444') : '#0ea5e9'; });

  chartInstances[prefix + 'volume'] = new Chart(document.getElementById(prefix + 'volumeChart'), {
    type: 'bar',
    data: { labels: names, datasets: [
      { label: 'Reads', data: sorted.map(function(p) { return p.reads; }), backgroundColor: '#cbd5e1' },
      { label: 'Creates', data: sorted.map(function(p) { return p.creates; }), backgroundColor: '#22c55e' },
      { label: 'Updates', data: sorted.map(function(p) { return p.updates; }), backgroundColor: '#3b82f6' }
    ]},
    options: { responsive: true, plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } } }, scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 25 } }, y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' } } } }
  });

  chartInstances[prefix + 'ratio'] = new Chart(document.getElementById(prefix + 'ratioChart'), {
    type: 'bar',
    data: { labels: names, datasets: [{ data: sorted.map(function(p) { return p.ratio; }), backgroundColor: barC, borderRadius: 4 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 25 } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' } } } }
  });

  var hSorted = data.slice().sort(function(a, b) { return b.estHours - a.estHours; });
  var hNames = hSorted.map(function(p) { return p.name.split(' ').slice(0, 2).join(' '); });
  var hColors = hSorted.map(function(p) { return p.isBench ? '#3b82f6' : p.estHours >= 120 ? '#22c55e' : p.estHours >= 80 ? '#84cc16' : p.estHours >= 50 ? '#f59e0b' : '#ef4444'; });

  chartInstances[prefix + 'hours'] = new Chart(document.getElementById(prefix + 'hoursChart'), {
    type: 'bar',
    data: { labels: hNames, datasets: [{ data: hSorted.map(function(p) { return p.estHours; }), backgroundColor: hColors, borderRadius: 4 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 25 } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' }, title: { display: true, text: 'Hours', font: { size: 10 } } } } }
  });

  var dSorted = data.slice().sort(function(a, b) { return b.activeDays - a.activeDays; });
  var dNames = dSorted.map(function(p) { return p.name.split(' ').slice(0, 2).join(' '); });
  var dColors = dSorted.map(function(p) { return p.isBench ? '#3b82f6' : p.activeDays >= 20 ? '#22c55e' : p.activeDays >= 17 ? '#84cc16' : p.activeDays >= 15 ? '#f59e0b' : '#ef4444'; });

  chartInstances[prefix + 'days'] = new Chart(document.getElementById(prefix + 'daysChart'), {
    type: 'bar',
    data: { labels: dNames, datasets: [{ data: dSorted.map(function(p) { return p.activeDays; }), backgroundColor: dColors, borderRadius: 4 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 25 } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' } } } }
  });

  var rSorted = data.slice().sort(function(a, b) { return b.dailyRate - a.dailyRate; });
  var rNames = rSorted.map(function(p) { return p.name.split(' ').slice(0, 2).join(' '); });
  var rColors = rSorted.map(function(p) { return p.isBench ? '#3b82f6' : p.dailyRate >= 300 ? '#22c55e' : p.dailyRate >= 200 ? '#84cc16' : p.dailyRate >= 100 ? '#f59e0b' : '#ef4444'; });

  chartInstances[prefix + 'rate'] = new Chart(document.getElementById(prefix + 'rateChart'), {
    type: 'bar',
    data: { labels: rNames, datasets: [{ data: rSorted.map(function(p) { return p.dailyRate; }), backgroundColor: rColors, borderRadius: 4 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 45, minRotation: 25 } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' }, title: { display: true, text: 'Actions/Day', font: { size: 10 } } } } }
  });

  var wSorted = data.slice().sort(function(a, b) { return b.avgHrsPerWeek - a.avgHrsPerWeek; });
  var wNames = wSorted.map(function(p) { return p.name.split(' ').slice(0, 2).join(' '); });
  var wColors = wSorted.map(function(p) { return p.isBench ? '#3b82f6' : p.avgHrsPerWeek >= 30 ? '#22c55e' : p.avgHrsPerWeek >= 20 ? '#84cc16' : p.avgHrsPerWeek >= 12 ? '#f59e0b' : '#ef4444'; });

  chartInstances[prefix + 'weekly'] = new Chart(document.getElementById(prefix + 'weeklyHrsChart'), {
    type: 'bar',
    data: { labels: wNames, datasets: [{ data: wSorted.map(function(p) { return p.avgHrsPerWeek; }), backgroundColor: wColors, borderRadius: 4 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 25 } }, y: { beginAtZero: true, grid: { color: '#f1f5f9' }, title: { display: true, text: 'Hrs/Week', font: { size: 10 } } } } }
  });

  // Person cards
  var personEl = document.getElementById(prefix + 'personCards');
  var scoreBg = function(s) { return s >= 8 ? '#22c55e' : s >= 6 ? '#84cc16' : s >= 5 ? '#eab308' : s >= 4 ? '#f97316' : '#ef4444'; };
  var cardOrder = data.slice().sort(function(a, b) {
    if (a.isBench) return -1; if (b.isBench) return 1;

  });

  cardOrder.forEach(function(p) {

  });
}

var currentTab = 'feb';
var rendered = {};

function switchTab(tabId) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-bar button').forEach(function(el) { el.classList.remove('active'); });

  // Show selected
  document.getElementById('tab-' + tabId).classList.add('active');
  var btns = document.querySelectorAll('.tab-bar button');
  var idx = { feb: 0, mar: 1, apr: 2, combined: 3 }[tabId];
  btns[idx].classList.add('active');

  // Destroy old charts if re-rendering
  if (rendered[tabId]) {
    destroyCharts(tabId + '_');
    document.getElementById('tab-' + tabId).innerHTML = '';
    rendered[tabId] = false;
  }

  // Render
  if (!rendered[tabId]) {
    if (tabId === 'feb') renderTab('feb', FEB_DATA, 'February 2026', 20, false);
    else if (tabId === 'mar') renderTab('mar', MAR_DATA, 'March 2026', 21, false);
    else if (tabId === 'apr') renderTab('apr', APR_DATA, 'April 2026', 22, true);
    else if (tabId === 'combined') renderTab('combined', COMBINED_DATA, 'Combined FebâApr 2026', 63, false);
    rendered[tabId] = true;
  }

  currentTab = tabId;
}

// Initial render
switchTab('feb');
